<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <title>Devfest Wallet</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='30' cy='35' r='18' fill='%234285F4'/><circle cx='70' cy='35' r='18' fill='%23EA4335'/><circle cx='30' cy='75' r='18' fill='%23FBBC05'/><circle cx='70' cy='75' r='18' fill='%2334A853'/></svg>">
</head>
<body>

  <!-- Floating Mobile Phone Device View -->
  <div class="phone-frame">

    <!-- Phone Status Bar & Dynamic Island (Desktop Demo Mode) -->
    <div class="phone-status-bar" aria-hidden="true">
      <span class="status-time">9:41</span>
      <div class="dynamic-island">
        <span class="camera-lens"></span>
      </div>
      <div class="status-icons">
        <svg class="status-icon" width="14" height="10" viewBox="0 0 17 12" fill="currentColor">
          <rect x="0" y="8" width="2.5" height="4" rx="0.5"/>
          <rect x="4.5" y="5.5" width="2.5" height="6.5" rx="0.5"/>
          <rect x="9" y="3" width="2.5" height="9" rx="0.5"/>
          <rect x="13.5" y="0" width="2.5" height="12" rx="0.5"/>
        </svg>
        <svg class="status-icon" width="13" height="10" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 10a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.24-2.83a6 6 0 0 1 8.48 0 .8.8 0 0 0 1.13-1.13 7.6 7.6 0 0 0-10.74 0 .8.8 0 0 0 1.13 1.13zm-2.83-2.83a10 10 0 0 1 14.14 0 .8.8 0 0 0 1.13-1.13 11.6 11.6 0 0 0-16.4 0 .8.8 0 0 0 1.13 1.13z"/>
        </svg>
        <svg class="status-icon status-battery" width="20" height="10" viewBox="0 0 25 12" fill="currentColor">
          <rect x="0.5" y="0.5" width="21" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <rect x="2" y="2" width="16" height="8" rx="1.5"/>
          <path d="M23 4.5v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="app-layout">
      
      <!-- Top Header -->
    <header class="top-nav">
      <div class="brand">
        <span class="logo-dots" aria-hidden="true">
          <span class="dot dot-blue"></span>
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </span>
        <span class="brand-name">Devfest Wallet</span>
      </div>

      <!-- User Selector (Names only, no technical IDs) -->
      <div class="user-picker">
        <label for="userSelect" class="sr-only">Active Account</label>
        <span class="avatar" id="userAvatar">👩</span>
        <select id="userSelect" class="user-dropdown" aria-label="Select User">
          <option value="user_101" selected>Alice Smith</option>
          <option value="user_102">Bob Jones</option>
          <option value="user_103">Charlie Brown (Frozen)</option>
        </select>
        <button id="resetDbBtn" class="btn-icon" title="Reset balances to seed" aria-label="Reset balances">
          🔄
        </button>
      </div>
    </header>

    <!-- Elegant Wallet Summary Bar -->
    <section class="wallet-bar" aria-label="Wallet Overview">
      <div class="wallet-bar-content">
        <div class="balance-meta">
          <span class="balance-caption">Available Balance</span>
          <div class="balance-display">
            <span class="balance-value" id="cardBalanceAmount">$1,250.00</span>
            <span class="currency-tag">USD</span>
          </div>
        </div>

        <div class="account-pill-group">
          <span class="pill pill-name" id="accountName">Alice Smith</span>
          <span class="pill pill-status active" id="accountStatus">Active</span>
          <span class="pill pill-tier" id="accountTier">Premium</span>
        </div>
      </div>

      <!-- Quick Action Prompt Chips -->
      <div class="action-chips" id="actionChips" aria-label="Suggested Prompts">
        <button class="chip" data-query="What is my current balance?">💰 Balance</button>
        <button class="chip" data-query="Transfer $35 to Bob for lunch">💸 Send $35 to Bob</button>
        <button class="chip" data-query="I want to top up $50 using virtual account">➕ Top Up $50 (VA)</button>
        <button class="chip" data-query="Check status of transfer TRF-1001">🔍 Check TRF-1001</button>
        <button class="chip" data-query="Show my recent transaction history">📜 History</button>
        <button class="chip" data-query="Transfer to Bob">⚠️ Test Guardrail</button>
      </div>
    </section>

    <!-- Main Chat Stream -->
    <main class="chat-container" id="chatContainer" role="log" aria-live="polite">
      
      <!-- Greeting from Assistant -->
      <div class="bubble assistant">
        <div class="bubble-header">
          <span class="bubble-sender">Devfest Assistant</span>
          <span class="badge-engine">Local MCP Engine</span>
        </div>
        <div class="bubble-content">
          <p>Hi <strong id="greetingName">Alice</strong>! I'm your digital wallet assistant.</p>
          <p>You can ask me to check your balance, transfer money, top up your wallet, or check payment status.</p>
        </div>
      </div>

    </main>

    <!-- Chat Input Area -->
    <footer class="input-area">
      <form class="input-form" id="chatForm">
        <input 
          type="text" 
          id="chatInput" 
          class="text-input" 
          placeholder="Ask a question or transfer money..." 
          autocomplete="off"
          required
          aria-label="Your message"
        >
        <button type="submit" id="sendBtn" class="send-button" aria-label="Send Message" title="Send">
          <svg viewBox="0 0 24 24" class="send-svg" aria-hidden="true">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/>
          </svg>
        </button>
      </form>
    </footer>

    </div>

    <!-- Phone Bottom Home Gesture Bar (Desktop Demo Mode) -->
    <div class="phone-home-bar" aria-hidden="true">
      <div class="home-indicator"></div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div class="toast-wrapper" id="toastWrapper" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
